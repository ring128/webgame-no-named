<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="渦で猫を引き戻し、24秒間ゴールを守るブラウザゲーム。実際の画面とプレイ映像を紹介します。">
  <title>道をふさげ。｜ゲーム画面・プレイ映像</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./preview.js"></script>
</head>
<body>
  <main>
    <header>
      <div><h1>道をふさげ<span>。</span></h1>
        <p>猫はゴールへの最短経路を探す。能力で進路を妨害し、24秒間足止めできればクリア。</p></div>
      <a href="https://github.com/ring128/webgame-no-named">ソースコード ↗</a>
    </header>
    <nav aria-label="表示するゲーム画面">
      <a href="#play" aria-current="true">プレイ映像</a><a href="#home">ホーム</a><a href="#stage">ステージ</a>
      <a href="#equipment">能力</a><a href="#skins">スキン</a><a href="#result">クリア結果</a>
    </nav>
    <figure id="play">
      <video controls playsinline preload="metadata" poster="./media/play.png" aria-label="石垣の庭で渦を使ってゴールを守るプレイ映像">
        <source src="./media/play.webm" type="video/webm">
        <a href="./media/play.webm">プレイ映像を開く</a>
      </video>
      <figcaption>「石垣の庭」の実プレイ。中央の能力で進路を妨害し直し、猫がゴールに着くのを防ぎます。</figcaption>
    </figure>
    <figure id="home"><img src="./media/home.png" width="960" height="640" alt="ドット絵の白猫とスタート・ランキング・スキン・意見が並ぶホーム画面"><figcaption>ホームからステージを選んで作戦を始めます。</figcaption></figure>
    <figure id="stage"><img src="./media/stage.png" width="960" height="640" alt="石垣の庭の地形と制限時間24秒が描かれたステージ選択画面"><figcaption>最初のステージ「石垣の庭」。中央の通路に向かって道が合流します。</figcaption></figure>
    <figure id="equipment"><img src="./media/equipment.png" width="960" height="640" alt="渦が選択され、未解放の能力と再使用時間が表示された画面"><figcaption>最初の能力は16種類からランダムに決まります。持ち込めるのは1種類。勝利を重ねると、新しい能力が解放されます。</figcaption></figure>
    <figure id="skins"><img src="./media/skins.png" width="960" height="640" alt="上段に4種類の猫の毛柄、下段に6種類の表情が並ぶスキン画面"><figcaption>毛柄と平常時の表情を組み合わせられます。</figcaption></figure>
    <figure id="result"><img src="./media/result.png" width="960" height="640" alt="作戦成功のスタンプと、ゴールまでの残り時間16.58秒を示すクリア画面"><figcaption>クリア時の位置から、妨害を解くと何秒でゴールできるかをスコアにします。</figcaption></figure>
  </main>
</body>
</html>
