<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>意見の管理</title>
</head>
<body>
  <main id="app"><div class="notebook"><div id="sheet">
    <h1>意見の管理</h1>
    <form id="login">
      <label for="key">管理キー</label>
      <input id="key" type="password" required autocomplete="current-password">
      <button class="primary">開く</button>
    </form>
    <section id="panel" hidden>
      <form id="search">
        <label for="query">本文・匿名IDで検索</label>
        <input id="query" type="search"><button>検索</button>
      </form>
      <p id="empty" hidden>該当する意見はありません。</p>
      <ol id="posts"></ol>
      <button id="more" hidden>さらに表示</button>
      <button id="close">管理を終了</button>
    </section>
    <p id="message" role="status"></p>
  </div></div></main>
  <script type="module" src="/src/admin.ts"></script>
</body>
</html>
